<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Consultation - DoctorSetu</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0d0d1a; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── TOP BAR ── */
    .consult-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
    }
    .consult-brand { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: #667eea; }
    .consult-brand i { color: #e94560; }
    .consult-info { font-size: 13px; color: #a0aec0; text-align: center; }
    .consult-info strong { color: white; display: block; font-size: 14px; }
    .consult-status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; }
    .status-dot.connected { background: #43e97b; animation: pulse-dot 1.2s infinite; }
    .status-dot.waiting   { background: #f7971e; }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── MAIN LAYOUT ── */
    .consult-body { display: flex; flex: 1; overflow: hidden; }

    /* ── VIDEO AREA ── */
    .video-area {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 16px; gap: 12px; position: relative;
    }

    .video-grid { display: flex; gap: 12px; width: 100%; max-width: 900px; align-items: center; justify-content: center; }

    .video-box {
      position: relative; border-radius: 16px; overflow: hidden;
      background: #1a1a2e; border: 2px solid rgba(255,255,255,0.1);
    }
    .video-box.remote { flex: 1; aspect-ratio: 16/9; max-height: 420px; }
    .video-box.local  { width: 180px; aspect-ratio: 4/3; flex-shrink: 0; }

    .video-box video { width: 100%; height: 100%; object-fit: cover; display: block; }

    .video-label {
      position: absolute; bottom: 8px; left: 10px;
      background: rgba(0,0,0,0.55); padding: 3px 10px;
      border-radius: 20px; font-size: 11px; font-weight: 600;
    }

    .video-placeholder {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      color: #a0aec0; font-size: 13px;
    }
    .video-placeholder i { font-size: 40px; color: #667eea; }

    /* ── CONTROLS ── */
    .controls {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px; background: rgba(255,255,255,0.04);
      border-radius: 50px; border: 1px solid rgba(255,255,255,0.08);
    }

    .ctrl-btn {
      width: 48px; height: 48px; border-radius: 50%; border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer; transition: all 0.2s;
    }
    .ctrl-btn.mic   { background: rgba(255,255,255,0.12); color: white; }
    .ctrl-btn.cam   { background: rgba(255,255,255,0.12); color: white; }
    .ctrl-btn.chat  { background: rgba(102,126,234,0.25); color: #667eea; }
    .ctrl-btn.end   { background: #e74c3c; color: white; width: 56px; height: 56px; font-size: 20px; }
    .ctrl-btn.muted { background: rgba(231,76,60,0.25); color: #e74c3c; }
    .ctrl-btn:hover { opacity: 0.85; transform: scale(1.05); }

    /* ── CHAT PANEL ── */
    .chat-panel {
      width: 320px; display: flex; flex-direction: column;
      background: #111827; border-left: 1px solid rgba(255,255,255,0.08);
      transition: width 0.3s; flex-shrink: 0;
    }
    .chat-panel.hidden { width: 0; overflow: hidden; }

    .chat-header {
      padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .chat-header h3 { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
    .chat-header h3 i { color: #667eea; }

    .post-call-info {
      padding: 8px 14px; background: rgba(247,151,30,0.12);
      border-bottom: 1px solid rgba(247,151,30,0.2);
      font-size: 11px; color: #f7971e; display: none;
      align-items: center; gap: 6px;
    }
    .post-call-info.show { display: flex; }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    .chat-msg {
      max-width: 85%; padding: 8px 12px; border-radius: 12px;
      font-size: 13px; line-height: 1.5; word-break: break-word;
    }
    .chat-msg.mine   { background: linear-gradient(135deg, #667eea, #764ba2); align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-msg.theirs { background: rgba(255,255,255,0.08); align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-msg .msg-sender { font-size: 10px; opacity: 0.7; margin-bottom: 3px; font-weight: 600; }
    .chat-msg .msg-time   { font-size: 10px; opacity: 0.5; margin-top: 3px; text-align: right; }

    .chat-system-msg {
      text-align: center; font-size: 11px; color: #a0aec0;
      padding: 4px 10px; background: rgba(255,255,255,0.04);
      border-radius: 20px; align-self: center;
    }

    .chat-input-area {
      padding: 12px; border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; gap: 8px; flex-shrink: 0;
    }
    .chat-input-area input {
      flex: 1; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 9px 14px; color: white; font-size: 13px;
      font-family: inherit; outline: none;
    }
    .chat-input-area input::placeholder { color: #666; }
    .chat-input-area input:focus { border-color: #667eea; }
    .chat-send-btn {
      width: 38px; height: 38px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; font-size: 14px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s;
    }
    .chat-send-btn:hover { opacity: 0.85; }
    .chat-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── POST-CALL OVERLAY ── */
    .post-call-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 100;
      align-items: center; justify-content: center;
    }
    .post-call-overlay.show { display: flex; }
    .post-call-box {
      background: #1a1a2e; border-radius: 20px; padding: 32px;
      text-align: center; max-width: 400px; width: 90%;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .post-call-box i { font-size: 52px; color: #e74c3c; margin-bottom: 16px; display: block; }
    .post-call-box h3 { font-size: 20px; margin-bottom: 8px; }
    .post-call-box p  { color: #a0aec0; font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
    .post-call-btns { display: flex; gap: 10px; justify-content: center; }
    .btn-continue-chat {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none; padding: 11px 24px;
      border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-leave {
      background: rgba(255,255,255,0.08); color: #a0aec0;
      border: none; padding: 11px 24px; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="consult-topbar">
    <div class="consult-brand"><i class="fas fa-heartbeat"></i> DoctorSetu</div>
    <div class="consult-info">
      <strong id="consultTitle">Online Consultation</strong>
      <span id="consultSubtitle">Connecting...</span>
    </div>
    <div class="consult-status">
      <div class="status-dot waiting" id="statusDot"></div>
      <span id="statusText">Waiting for other party...</span>
    </div>
  </div>

  <!-- BODY -->
  <div class="consult-body">

    <!-- VIDEO AREA -->
    <div class="video-area">
      <div class="video-grid">
        <!-- Remote video -->
        <div class="video-box remote">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="video-placeholder" id="remotePlaceholder">
            <i class="fas fa-user-md"></i>
            <span id="remotePlaceholderText">Waiting for other party to join...</span>
          </div>
          <div class="video-label" id="remoteLabel">Remote</div>
        </div>
        <!-- Local video -->
        <div class="video-box local">
          <video id="localVideo" autoplay playsinline muted></video>
          <div class="video-placeholder" id="localPlaceholder">
            <i class="fas fa-video-slash" style="font-size:24px;"></i>
          </div>
          <div class="video-label" id="localLabel">You</div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="ctrl-btn mic"  id="micBtn"  onclick="toggleMic()"  title="Mute/Unmute"><i class="fas fa-microphone" id="micIcon"></i></button>
        <button class="ctrl-btn cam"  id="camBtn"  onclick="toggleCam()"  title="Camera on/off"><i class="fas fa-video" id="camIcon"></i></button>
        <button class="ctrl-btn end"  id="endBtn"  onclick="endCall()"    title="End Call"><i class="fas fa-phone-slash"></i></button>
        <button class="ctrl-btn chat" id="chatBtn" onclick="toggleChat()" title="Toggle Chat"><i class="fas fa-comment-dots"></i></button>
      </div>
    </div>

    <!-- CHAT PANEL -->
    <div class="chat-panel" id="chatPanel">
      <div class="chat-header">
        <h3><i class="fas fa-comment-dots"></i> Live Chat</h3>
        <span id="chatLimitBadge" style="font-size:11px;color:#f7971e;display:none;"></span>
      </div>
      <div class="post-call-info" id="postCallInfo">
        <i class="fas fa-info-circle"></i>
        <span id="postCallInfoText"></span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChat()">
        <button class="chat-send-btn" id="chatSendBtn" onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <!-- POST-CALL OVERLAY -->
  <div class="post-call-overlay" id="postCallOverlay">
    <div class="post-call-box">
      <i class="fas fa-phone-slash"></i>
      <h3>Call Ended</h3>
      <p id="postCallMsg">The call has ended. You can still send up to <strong>15 messages</strong> to continue your consultation.</p>
      <div class="post-call-btns">
        <button class="btn-continue-chat" onclick="continueWithChat()"><i class="fas fa-comment-dots"></i> Continue Chat</button>
        <button class="btn-leave" onclick="leavePage()"><i class="fas fa-sign-out-alt"></i> Leave</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ── PARAMS ──────────────────────────────────────────────
    const params        = new URLSearchParams(location.search);
    const appointmentId = params.get('appointmentId');
    const role          = params.get('role');          // 'doctor' | 'patient'
    const myName        = decodeURIComponent(params.get('name') || role);
    const token         = localStorage.getItem(role === 'doctor' ? 'doctorToken' : 'patientToken');
    const API           = 'http://localhost:3000/api';
    const chatAPI       = role === 'doctor' ? `${API}/doctor/chat` : `${API}/patient/chat`;

    const POST_CALL_LIMIT = 15;
    let callActive    = true;
    let postCallCount = 0;
    let localStream   = null;
    let peerConn      = null;
    let micOn = true, camOn = true;

    // ── SOCKET ──────────────────────────────────────────────
    const socket = io();

    // ── UI INIT ─────────────────────────────────────────────
    document.getElementById('localLabel').textContent  = myName;
    document.getElementById('remoteLabel').textContent = role === 'doctor' ? 'Patient' : 'Doctor';
    document.getElementById('remotePlaceholderText').textContent =
      `Waiting for ${role === 'doctor' ? 'patient' : 'doctor'} to join...`;
    document.getElementById('consultTitle').textContent =
      role === 'doctor' ? 'Patient Consultation' : 'Doctor Consultation';

    // ── WEBRTC SETUP ─────────────────────────────────────────
    const iceConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    async function startMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('localPlaceholder').style.display = 'none';
      } catch (e) {
        addSystemMsg('Camera/mic access denied. Video unavailable.');
      }
      socket.emit('join-room', { appointmentId, role, name: myName });
    }

    function createPeer() {
      peerConn = new RTCPeerConnection(iceConfig);
      if (localStream) localStream.getTracks().forEach(t => peerConn.addTrack(t, localStream));

      peerConn.ontrack = e => {
        document.getElementById('remoteVideo').srcObject = e.streams[0];
        document.getElementById('remotePlaceholder').style.display = 'none';
        document.getElementById('statusDot').className = 'status-dot connected';
        document.getElementById('statusText').textContent = 'Connected';
      };

      peerConn.onicecandidate = e => {
        if (e.candidate) socket.emit('ice-candidate', { appointmentId, candidate: e.candidate });
      };
    }

    socket.on('peer-joined', async ({ role: peerRole, name }) => {
      addSystemMsg(`${name} joined the call`);
      document.getElementById('remoteLabel').textContent = name;
      document.getElementById('statusDot').className = 'status-dot waiting';
      document.getElementById('statusText').textContent = 'Connecting...';
      // Caller creates offer
      if (role === 'doctor') {
        createPeer();
        const offer = await peerConn.createOffer();
        await peerConn.setLocalDescription(offer);
        socket.emit('offer', { appointmentId, offer });
      }
    });

    socket.on('offer', async ({ offer }) => {
      createPeer();
      await peerConn.setRemoteDescription(offer);
      const answer = await peerConn.createAnswer();
      await peerConn.setLocalDescription(answer);
      socket.emit('answer', { appointmentId, answer });
    });

    socket.on('answer', async ({ answer }) => {
      await peerConn?.setRemoteDescription(answer);
    });

    socket.on('ice-candidate', async ({ candidate }) => {
      try { await peerConn?.addIceCandidate(candidate); } catch {}
    });

    socket.on('peer-left', ({ role: peerRole }) => {
      addSystemMsg(`${peerRole === 'doctor' ? 'Doctor' : 'Patient'} left the call`);
      document.getElementById('remoteVideo').srcObject = null;
      document.getElementById('remotePlaceholder').style.display = 'flex';
      document.getElementById('statusDot').className = 'status-dot waiting';
      document.getElementById('statusText').textContent = 'Disconnected';
    });

    socket.on('call-ended', () => {
      callActive = false;
      showPostCallOverlay();
    });

    // ── CONTROLS ─────────────────────────────────────────────
    function toggleMic() {
      if (!localStream) return;
      micOn = !micOn;
      localStream.getAudioTracks().forEach(t => t.enabled = micOn);
      document.getElementById('micIcon').className = micOn ? 'fas fa-microphone' : 'fas fa-microphone-slash';
      document.getElementById('micBtn').className  = micOn ? 'ctrl-btn mic' : 'ctrl-btn mic muted';
    }

    function toggleCam() {
      if (!localStream) return;
      camOn = !camOn;
      localStream.getVideoTracks().forEach(t => t.enabled = camOn);
      document.getElementById('camIcon').className = camOn ? 'fas fa-video' : 'fas fa-video-slash';
      document.getElementById('camBtn').className  = camOn ? 'ctrl-btn cam' : 'ctrl-btn cam muted';
    }

    function toggleChat() {
      document.getElementById('chatPanel').classList.toggle('hidden');
    }

    function endCall() {
      if (!confirm('End the call?')) return;
      socket.emit('call-ended', { appointmentId });
      callActive = false;
      stopMedia();
      showPostCallOverlay();
    }

    function stopMedia() {
      localStream?.getTracks().forEach(t => t.stop());
      peerConn?.close();
      document.getElementById('localVideo').srcObject  = null;
      document.getElementById('remoteVideo').srcObject = null;
      document.getElementById('localPlaceholder').style.display  = 'flex';
      document.getElementById('remotePlaceholder').style.display = 'flex';
    }

    // ── POST-CALL ─────────────────────────────────────────────
    function showPostCallOverlay() {
      document.getElementById('postCallOverlay').classList.add('show');
    }

    function continueWithChat() {
      document.getElementById('postCallOverlay').classList.remove('show');
      document.getElementById('chatPanel').classList.remove('hidden');
      document.getElementById('postCallInfo').classList.add('show');
      updatePostCallUI();
      addSystemMsg('Call ended. You can send up to 15 more messages.');
    }

    function leavePage() {
      window.close();
      history.back();
    }

    function updatePostCallUI() {
      const remaining = POST_CALL_LIMIT - postCallCount;
      const badge = document.getElementById('chatLimitBadge');
      const info  = document.getElementById('postCallInfoText');
      badge.style.display = 'inline';
      badge.textContent   = `${remaining} msgs left`;
      info.textContent    = `Post-call: ${remaining} of ${POST_CALL_LIMIT} messages remaining`;
      if (remaining <= 0) {
        document.getElementById('chatInput').disabled    = true;
        document.getElementById('chatSendBtn').disabled  = true;
        document.getElementById('chatInput').placeholder = 'Message limit reached';
      }
    }

    // ── CHAT ─────────────────────────────────────────────────
    socket.on('chat-message', data => {
      if (data.senderId !== socket.id) {
        appendChatMsg(data.senderName, data.message, false, data.time);
        if (!data.duringCall) { postCallCount++; updatePostCallUI(); }
      }
    });

    async function sendChat() {
      const input = document.getElementById('chatInput');
      const msg   = input.value.trim();
      if (!msg) return;

      const duringCall = callActive;

      if (!duringCall && postCallCount >= POST_CALL_LIMIT) {
        addSystemMsg('Message limit reached.');
        return;
      }

      input.value = '';
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      appendChatMsg('You', msg, true, time);

      // Relay via socket
      socket.emit('chat-message', {
        appointmentId, senderName: myName, message: msg,
        senderId: socket.id, duringCall, time
      });

      // Persist to DB
      try {
        await fetch(`${chatAPI}/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ appointmentId, message: msg, duringCall, senderName: myName })
        });
        if (!duringCall) { postCallCount++; updatePostCallUI(); }
      } catch {}
    }

    function appendChatMsg(sender, text, isMine, time) {
      const el  = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = `chat-msg ${isMine ? 'mine' : 'theirs'}`;
      div.innerHTML = `
        ${!isMine ? `<div class="msg-sender">${sender}</div>` : ''}
        ${text}
        <div class="msg-time">${time || ''}</div>`;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }

    function addSystemMsg(text) {
      const el  = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className   = 'chat-system-msg';
      div.textContent = text;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }

    async function loadChatHistory() {
      try {
        const res  = await fetch(`${chatAPI}/${appointmentId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        postCallCount = data.postCallCount || 0;
        (data.messages || []).forEach(m => {
          const isMine = m.senderRole === role;
          const time   = new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          appendChatMsg(m.senderName || m.senderRole, m.message, isMine, time);
        });
      } catch {}
    }

    // ── INIT ─────────────────────────────────────────────────
    startMedia();
    loadChatHistory();
  </script>
</body>
</html>
